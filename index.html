<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>迷ったらルーレット</title><style>body{font-family:-apple-system,sans-serif;background:#faf9f7;color:#253047;margin:0}main{max-width:500px;margin:auto;padding:24px 18px}h1{text-align:center;margin-bottom:4px}p{text-align:center;color:#888}canvas{width:100%;display:block}.wheel{position:relative}.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid #e85d70}.modes{display:flex;justify-content:center;gap:22px;margin:15px}input[type=radio]{accent-color:#5d8ee6}button{cursor:pointer}.spin{width:100%;border:0;border-radius:20px;background:#5d8ee6;color:white;padding:18px;font-size:23px;font-weight:bold}.spin.stop{background:#e85d70}.spin:disabled{opacity:.5}#result{text-align:center;font-size:24px;font-weight:bold;min-height:55px;padding-top:18px}.panel{background:white;border:1px solid #ddd;border-radius:20px;padding:18px}.item,.add{display:flex;gap:8px;margin:8px 0}.item input,.add input{flex:1;min-width:0;border:1px solid #ddd;border-radius:10px;padding:12px;font-size:16px}.item button,.add button{background:white;border:1px solid #ddd;border-radius:10px;padding:0 14px;font-size:17px}</style></head><body><main><h1>迷ったらルーレット</h1><p>迷ったら、運に任せよう。</p><div class="wheel"><canvas id="wheel" width="700" height="700"></canvas><div class="pointer"></div></div><div class="modes"><label><input type="radio" name="mode" value="auto" checked> 自動停止</label><label><input type="radio" name="mode" value="manual"> 手動停止</label></div><button id="spin" class="spin">回す！</button><div id="result" aria-live="polite"></div><section class="panel"><b>選択肢</b><div id="items"></div><form id="add" class="add"><input id="new" placeholder="選択肢を追加" maxlength="40"><button>追加</button></form></section></main><script>(()=>{'use strict';const defaults=['ラーメン','カレー','そば','定食'];let items;try{items=JSON.parse(localStorage.getItem('roulette-items'))}catch(e){}if(!Array.isArray(items)||items.length<2)items=defaults;const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),btn=document.getElementById('spin'),result=document.getElementById('result'),list=document.getElementById('items'),colors=['#f58fa0','#ffc27b','#ffe184','#85d5b0','#8eb8f9','#bca0df','#9ad8d3','#eab0be'];let angle=0,speed=0,active=false,stopping=false,last=0;function save(){try{localStorage.setItem('roulette-items',JSON.stringify(items))}catch(e){}}function draw(){const c=350,r=318,n=items.length;ctx.clearRect(0,0,700,700);items.forEach((item,i)=>{let a=angle-Math.PI/2+i*2*Math.PI/n,b=a+2*Math.PI/n;ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,b);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.translate(c,c);ctx.rotate((a+b)/2);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#263047';ctx.font='bold 26px sans-serif';ctx.fillText(item.length>8?item.slice(0,8)+'…':item,r*.63,0,r*.68);ctx.restore()});ctx.beginPath();ctx.arc(c,c,29,0,Math.PI*2);ctx.fillStyle='white';ctx.fill()}function render(){list.replaceChildren();items.forEach((item,i)=>{const row=document.createElement('div');row.className='item';const input=document.createElement('input');input.value=item;input.disabled=active;input.onchange=()=>{items[i]=input.value.trim()||item;save();draw()};const del=document.createElement('button');del.textContent='×';del.disabled=active||items.length<=2;del.onclick=()=>{items.splice(i,1);save();render();draw()};row.append(input,del);list.append(row)})}function finish(){active=false;stopping=false;btn.disabled=false;btn.classList.remove('stop');btn.textContent='もう一度回す';const n=items.length,normalized=(((-angle)%(2*Math.PI))+2*Math.PI)%(2*Math.PI),i=Math.floor(normalized/(2*Math.PI/n))%n;result.textContent='🎉 '+items[i]+'！';render()}function frame(t){if(!active)return;const dt=Math.min((t-last)/1000,.05);last=t;angle=(angle+speed*dt)%(2*Math.PI);if(stopping){speed*=Math.exp(-1.7*dt);if(speed<.15){draw();finish();return}}draw();requestAnimationFrame(frame)}btn.onclick=()=>{if(active){if(!stopping){stopping=true;btn.disabled=true;btn.textContent='停止中…'}return}active=true;stopping=false;speed=11+Math.random()*3;result.textContent='';const manual=document.querySelector('input[name=mode]:checked').value==='manual';btn.textContent=manual?'止める！':'回転中…';btn.classList.toggle('stop',manual);btn.disabled=!manual;render();last=performance.now();requestAnimationFrame(frame);if(!manual)setTimeout(()=>{if(active)stopping=true},1500+Math.random()*700)};document.getElementById('add').onsubmit=e=>{e.preventDefault();const f=document.getElementById('new'),v=f.value.trim();if(!v||active||items.length>=16)return;items.push(v);f.value='';save();render();draw()};draw();render()})();</script></body></html>
